<!-- Documento de tipo html. Indica la última versión -->
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- charset se refiere a los tipos de caracteres. El UTF-8 hacen referencia a la ñ y otros caracteres -->
    <meta charset="UTF-8">
    <!-- Creada por Apple para hacer responsive (las páginas se ven mejor en celular) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./clase3.css">
</head>
<body>
    <!-- CSS: Cascade StyleSheet u hoja de estilos en cascada -->
    <p>Hola</p>
    <main>
        <p>Este es el main</p>
    </main>
    <button>Dame click</button>
</body>
</html>
