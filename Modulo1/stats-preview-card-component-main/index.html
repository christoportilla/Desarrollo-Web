<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Frontend Mentor | Stats preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div id="container">
    <div id="info">
      <h1 id="title">Get insights that help your business grow.</h1>
      <p id="description">Discover the benefits of data analytics and make better decisions regarding revenue, customer 
  experience, and overall efficiency.</p>
      <div id="stats">
        <div class="data">
          <p class="number"> 10k+</p>
          <p class="dataDescription">companies</p>
        </div>
        <div class="data">
          <p class="number">314</p>
          <p class="dataDescription">templates</p>
        </div>
        <div class="data">
          <p class="number">12m+</p>
          <p class="dataDescription">queries</p>
        </div>
      </div>
    </div>
      <img src="./images/image-header-desktop.jpg" alt="imagenEscritorio">
    </div>
  </div>

</body>
</html>
